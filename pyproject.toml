[project]
name = "research-image-processing"
version = "0.1.0"
description = "Learning and implementation workspace for image processing and computer vision."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "albumentations>=2.0.8",
    "accelerate>=1.10.1",
    "anomalib[clip,vlm]>=2.2.0",
    "huggingface-hub>=0.35.1",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.4.1",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "onnx>=1.17.0",
    "onnxruntime-gpu>=1.20.0",
    "onnxscript>=0.2.0",
    "opencv-python-headless>=4.11.0.86",
    "optuna>=4.3.0",
    "optuna-integration[pytorch_lightning]>=4.3.0",
    "pandas>=2.2.3",
    "pillow>=11.2.1",
    "pycocotools>=2.0.8",
    "pyyaml>=6.0.2",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "timm>=1.0.15",
    "tensorrt-cu12>=10.0.0; platform_system == 'Linux'",
    "einops>=0.8.1",
    "transformers>=4.57.0,<5",
    "tqdm>=4.67.1",
]

[tool.uv]
package = false
