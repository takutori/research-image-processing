experiment_name: oxford_pet_quick
model_name: microsoft/Florence-2-base-ft
dataset_root: /workspace/data/oxford_iiit_pet
output_dir: /workspace/checkpoints/classification/florence2/oxford_pet_quick
tuning_mode: none

subset:
  train_examples: 64
  valid_examples: 32
  test_examples: 32

train:
