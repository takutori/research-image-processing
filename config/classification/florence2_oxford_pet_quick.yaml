  random_state: 42
  use_amp: true

grid:
  learning_rates: [0.00005]
  weight_decays: [0.0001]
  batch_sizes: [1]
  image_sizes: [224]
  num_epochs: 1
  num_workers: 0

optuna:
  n_trials: 1
  num_epochs: 1
  num_workers: 0
  batch_size_candidates: [1]
  image_size_candidates: [224]
