experiment_name: oxford_pet_fewshot
model_name: google/siglip2-base-patch16-224
dataset_root: /workspace/data/oxford_iiit_pet
output_dir: /workspace/checkpoints/classification/siglip2/oxford_pet_fewshot

fewshot:
  shots_per_class: 8
  random_state: 42

train:
  batch_size: 24
  num_workers: 0
  num_epochs: 10
  learning_rate: 0.00005
  weight_decay: 0.0001
  valid_size: 0.2
  random_state: 42
  use_amp: true
