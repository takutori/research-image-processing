experiment_name: stfpm_visa
dataset_root: /workspace/data/visa
tuning_mode: full
categories:
  - candle

model:
  backbone: resnet18
  layers: [layer1, layer2, layer3]
  pre_trained: true

train:
  image_size: 256
  batch_size: 32
  num_workers: 12
  max_epochs: 100
  val_split_ratio: 0.2
  seed: 42

grid:
  backbones: [resnet18, wide_resnet50_2]
  image_sizes: [224, 256]
  layers_list:
    - [layer1, layer2, layer3]
    - [layer2, layer3]

optuna:
  n_trials: 20
  backbone_candidates: [resnet18, wide_resnet50_2]
  image_size_candidates: [224, 256]
  layers_candidates:
    - [layer1, layer2, layer3]
    - [layer2, layer3]
