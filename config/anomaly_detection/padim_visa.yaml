experiment_name: padim_visa
dataset_root: /workspace/data/visa
tuning_mode: grid
categories:
  - candle

model:
  backbone: resnet18
  layers: [layer1, layer2, layer3]
  pre_trained: true
  n_features: null

train:
  image_size: 224
  batch_size: 32
  num_workers: 12
  val_split_ratio: 0.2
  seed: 42

grid:
  backbones: [resnet18, wide_resnet50_2]
  image_sizes: [224, 320]
  n_features_list: [100, 200]
