experiment_name: patchcore_visa_smoke
dataset_root: /workspace/data/visa_smoke
output_dir: /workspace/checkpoints/anomaly_detection/patchcore/visa_smoke
tuning_mode: grid
categories: [candle]

model:
  backbone: resnet18
  layers: [layer2, layer3]
  pre_trained: true
  coreset_sampling_ratio: 0.1
  num_neighbors: 9

train:
  image_size: 224
  batch_size: 4
  num_workers: 0
  val_split_ratio: 0.2
  seed: 42

grid:
  backbones: [resnet18]
  image_sizes: [224]
  coreset_sampling_ratios: [0.1]
