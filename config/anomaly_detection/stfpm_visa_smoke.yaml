experiment_name: stfpm_visa_smoke
dataset_root: /workspace/data/visa_smoke
output_dir: /workspace/checkpoints/anomaly_detection/stfpm/visa_smoke
tuning_mode: full
categories: [candle]

model:
  backbone: resnet18
  layers: [layer1, layer2, layer3]
  pre_trained: true

train:
  image_size: 224
  batch_size: 4
  num_workers: 0
  max_epochs: 2
  val_split_ratio: 0.2
  seed: 42

grid:
  backbones: [resnet18]
  image_sizes: [224]
  layers_list:
    - [layer1, layer2, layer3]

optuna:
  n_trials: 1
  image_size_candidates: [224]
  layers_candidates:
    - [layer1, layer2, layer3]
