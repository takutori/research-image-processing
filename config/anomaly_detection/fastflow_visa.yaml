experiment_name: fastflow_visa
dataset_root: /workspace/data/visa
tuning_mode: full
categories:
  - candle

model:
  backbone: resnet18
  pre_trained: true
  flow_steps: 8
  hidden_ratio: 1.0

train:
  image_size: 256
  batch_size: 32
  num_workers: 12
  max_epochs: 100
  val_split_ratio: 0.2
  seed: 42

grid:
  backbones: [resnet18, wide_resnet50_2]
  image_sizes: [224, 256]
  flow_steps_list: [8]

optuna:
  n_trials: 20
  backbone_candidates: [resnet18, wide_resnet50_2]
  image_size_candidates: [224, 256]
  flow_steps_candidates: [8, 12]
  hidden_ratio_candidates: [0.5, 1.0, 2.0]
