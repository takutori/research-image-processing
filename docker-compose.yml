services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-gpu}
    container_name: research-image-processing
    working_dir: /workspace
    tty: true
    stdin_open: true
    environment:
      TORCH_VARIANT: ${TORCH_VARIANT:-gpu}
      UV_NO_SYNC: "1"
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
      - ${HOST_DATA_DIR:?HOST_DATA_DIR must point to a host directory for datasets}:/workspace/data
      - uv-cache:/root/.cache/uv
      - venv-cpu:/workspace/.venv
    command: bash -lc "uv sync && if [ \"$${TORCH_VARIANT}\" = \"gpu\" ]; then uv pip install --python /workspace/.venv/bin/python --index-url https://download.pytorch.org/whl/cu124 torch==2.6.0 torchvision==0.21.0; else uv pip install --python /workspace/.venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0; fi && sleep infinity"

volumes:
  uv-cache:
  venv-cpu:
